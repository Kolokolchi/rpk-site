  <g fill="#101719" opacity=".9">
    <rect x="90" y="229" width="48" height="9" rx="2"/>
    <rect x="142" y="229" width="38" height="9" rx="2" opacity=".44"/>
    <circle cx="118" cy="217" r="3.6"/>
    <circle cx="154" cy="217" r="3.6"/>

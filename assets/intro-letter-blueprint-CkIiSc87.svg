      <path d="M198 174H276M210 145 268 145M225 112 252 112" stroke="#f05a28" stroke-opacity=".55" stroke-width="1.5"/>
    </g>

    <g transform="translate(-72 48)">
      <path d="M241 46 340 211 300 211 281 178 195 178 176 211 136 211 236 46z" fill="none" stroke="#101719" stroke-opacity=".34" stroke-width="2.3" stroke-dasharray="8 6"/>
      <path d="M238 92 212 145H265z" fill="none" stroke="#101719" stroke-opacity=".28" stroke-width="2" stroke-dasharray="7 6"/>
      <circle cx="193" cy="190" r="4" fill="#f05a28"/>
      <circle cx="271" cy="190" r="4" fill="#f05a28"/>
      <circle cx="237" cy="72" r="4" fill="#f05a28"/>
      <circle cx="236" cy="132" r="4" fill="#f05a28"/>
    </g>
  </g>

  <g fill="none" stroke="#6f7978" stroke-linecap="round" stroke-width="1.6" opacity=".72">
    <path d="M144 114 115 129"/>
    <path d="M168 142 135 160"/>
    <path d="M189 178 151 199"/>
    <path d="M211 212 173 233"/>
    <path d="M287 88 326 69"/>
    <path d="M307 122 352 99"/>
    <path d="M330 160 370 139"/>

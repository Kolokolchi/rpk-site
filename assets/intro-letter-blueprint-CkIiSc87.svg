<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 300" role="img" aria-labelledby="title desc">
  <title id="title">Разобранная аксонометрия объемной буквы А</title>
  <desc id="desc">Техническая схема объемной буквы А: лицевая панель, борт, LED-модули, алюминиевый каркас, задняя панель и дистанционные крепления.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#101719" stroke-opacity=".075" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 8 4 0 8z" fill="#f05a28"/>
    </marker>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="7" flood-color="#101719" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="430" height="300" rx="8" fill="#f4f5f2"/>
  <rect width="430" height="300" rx="8" fill="url(#grid)"/>
  <path d="M38 250H392M56 52V246M378 52V246" fill="none" stroke="#101719" stroke-opacity=".12" stroke-dasharray="5 7"/>

  <g font-family="Montserrat, Arial, sans-serif" font-weight="800" letter-spacing=".06em">
    <text x="34" y="34" fill="#f05a28" font-size="11">АКСОНОМЕТРИЯ / БУКВА A</text>
    <text x="338" y="36" fill="#101719" font-size="9" opacity=".42">SCALE 1:12</text>
  </g>

  <g fill="none" stroke="#f05a28" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 63H333" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M67 70V58M333 70V58" stroke-width="1.4"/>
    <path d="M48 79V224" stroke-width="1.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M56 80H42M56 224H42" stroke-width="1.4"/>
  </g>

  <g filter="url(#soft-shadow)">
    <g opacity=".98">
      <path d="M241 46 340 211 300 211 281 178 195 178 176 211 136 211 236 46z" fill="#dfe3dd" stroke="#101719" stroke-opacity=".42" stroke-width="2"/>
      <path d="M238 92 212 145H265z" fill="#f4f5f2" stroke="#101719" stroke-opacity=".35" stroke-width="2"/>
    </g>

    <g transform="translate(-24 16)">
      <path d="M241 46 340 211 300 211 281 178 195 178 176 211 136 211 236 46z" fill="#ffffff" stroke="#101719" stroke-opacity=".6" stroke-width="2"/>
      <path d="M238 92 212 145H265z" fill="#f4f5f2" stroke="#101719" stroke-opacity=".42" stroke-width="2"/>
      <path d="M176 211 136 211 236 46 241 46" fill="none" stroke="#f05a28" stroke-opacity=".6" stroke-width="1.4"/>
    </g>

    <g transform="translate(-48 32)" fill="none" stroke="#101719" stroke-width="2">
      <path d="M241 46 340 211 300 211 281 178 195 178 176 211 136 211 236 46z" stroke-opacity=".72"/>

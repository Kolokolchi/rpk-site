  <g font-family="Montserrat, Arial, sans-serif" font-size="9.5" font-weight="700" letter-spacing=".03em">
    <text x="69" y="53" fill="#f05a28">W 1280</text>
    <text x="24" y="158" fill="#f05a28" transform="rotate(-90 24 158)">H 1600</text>
    <text x="67" y="264" fill="#101719" opacity=".64">дистанционные крепления</text>
    <text x="257" y="62" fill="#101719" opacity=".72">1 лицевая панель</text>
    <text x="324" y="94" fill="#101719" opacity=".72">2 борт</text>
    <text x="334" y="133" fill="#101719" opacity=".72">3 LED</text>
    <text x="333" y="173" fill="#101719" opacity=".72">4 каркас</text>
